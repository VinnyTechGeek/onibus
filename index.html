<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horário Ônibus">
<title>Horário Ônibus</title>
<!--
  Horário Ônibus — histórico de versões
  v1.0  build inicial: cards de linha, timeline, grade de horários, e a UI do
        simulador de dia/horário na aba Linhas (sem lógica ligada ainda).
  v1.1  tema visual (Noiva Cadáver) reforçado — cemitério maior e mais nítido,
        árvore seca, portão de ferro, céu estrelado, névoa com deriva animada;
        cards um pouco mais translúcidos pra deixar o cenário respirar atrás.
        Simulador de horário/dia agora funciona de verdade nos dois sentidos
        (Casa→Estação e Estação→Casa), pra consultar qualquer dia/hora.
  v1.2  nome do app trocado de "TransFranco" pra "Ônibus" (mesma letra gótica
        em estilo osso). Vocabulário visual do filme mais explícito: silhueta
        da noiva de véu parada entre as lápides, e teia de aranha no canto —
        pra ficar claro de cara que a referência é Noiva Cadáver, não um
        clima genérico de cemitério.
  v1.3  Aba Horários ganhou toggle Estação↔Casa (igual ao da Home) acima dos
        dias — no sentido Casa→Estação cada horário mostra o par "saia de
        casa" + "ônibus no ponto" lado a lado, sem perder a divisão por
        turno/dia útil/sábado/domingo nem a busca por texto. Tema visual
        Noiva Cadáver aprofundado: corvo pousado no portão de ferro (belisca
        as penas de vez em quando), gato preto de olhos amarelos entre as
        lápides, e buquê de flores murchas nas mãos da noiva, que agora
        balança bem devagar como se sentisse uma brisa do submundo.
  v1.4  nome trocado de "Ônibus" pra "Horário Ônibus" (mais claro/descritivo)
        e a fonte gótica (UnifrakturCook) foi removida — nome agora em letra
        normal (Inter), a pedido explícito do usuário.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root {
  /* Surfaces */
  --bg:           #07070d;
  --surface:      #0f0f1a;
  --surface-el:   #161625;
  --surface-hi:   #1f1f33;

  /* Text */
  --text:         #eef1fa;
  --text-sec:     #9aa3c4;
  --text-ter:     #565b7d;

  /* Accent */
  --a210:         #38bdf8;
  --a210-glow:    rgba(56,189,248,.25);
  --a210-dim:     rgba(56,189,248,.14);
  --a240:         #8b5cf6;
  --a240-glow:    rgba(139,92,246,.25);
  --a240-dim:     rgba(139,92,246,.14);

  /* Semantic */
  --success:      #4ade80;
  --warning:      #eab308;
  --danger:       #e11d48;
  --info:         #ec4899;

  /* Borders & shadows */
  --border:       rgba(148,163,255,.08);
  --border-hi:    rgba(148,163,255,.16);
  --shadow:       0 1px 3px rgba(0,0,0,.2);
  --shadow-lg:    0 2px 8px rgba(0,0,0,.25);

  /* Layout */
  --nav-h:        calc(56px + env(safe-area-inset-top, 0px));
  --tab-h:        calc(64px + env(safe-area-inset-bottom, 0px));
  --radius-sm:    10px;
  --radius:       16px;
  --radius-lg:    22px;

  /* Type scale */
  --t-xs:  12px;
  --t-sm:  13px;
  --t-md:  14px;
  --t-base:16px;
  --t-lg:  19px;
  --t-xl:  26px;
  --t-2xl: 34px;
  --t-3xl: 40px;
}

/* ═══════════════════════════════════════
   RESET
═══════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; overflow-x:hidden; }
button { border:none; background:none; font-family:inherit; cursor:pointer; color:inherit; }
input  { font-family:inherit; }
::-webkit-scrollbar { width:0; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

/* ═══════════════════════════════════════
   AMBIENTAÇÃO TEMÁTICA — Noiva Cadáver
   Camada fixa, decorativa, atrás de todo o conteúdo. Não interativa.
   v1.1: cenário mais denso e mais visível — céu estrelado, cemitério maior
   com árvore seca e portão, névoa com deriva lenta.
═══════════════════════════════════════ */
.bg-fx { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }

/* Céu estrelado — bem discreto, só pra dar profundidade acima da lua */
.bg-stars {
  position:absolute; inset:0;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 10%, rgba(255,255,255,.85), transparent),
    radial-gradient(1px   1px   at 28% 6%,  rgba(255,255,255,.6),  transparent),
    radial-gradient(1.6px 1.6px at 45% 16%, rgba(255,255,255,.7),  transparent),
    radial-gradient(1px   1px   at 62% 4%,  rgba(255,255,255,.55), transparent),
    radial-gradient(1.4px 1.4px at 78% 13%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px   1px   at 90% 20%, rgba(255,255,255,.5),  transparent),
    radial-gradient(1.2px 1.2px at 6%  24%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px   1px   at 52% 26%, rgba(255,255,255,.4),  transparent);
  opacity:.75;
  animation:starTwinkle 7s ease-in-out infinite alternate;
}
@keyframes starTwinkle { from { opacity:.45; } to { opacity:.85; } }

/* Lua espectral no canto superior — glow frio, como a luz que ilumina o submundo */
.bg-moon {
  position:absolute; top:-50px; right:-30px;
  width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(238,241,250,.98), rgba(56,189,248,.4) 55%, transparent 72%);
  box-shadow:0 0 160px 70px rgba(56,189,248,.28);
  opacity:.85;
  animation:moonPulse 8s ease-in-out infinite;
}
@keyframes moonPulse { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.12); } }

/* Névoa roxa subindo do rodapé, com deriva lateral bem lenta */
.bg-fog {
  position:absolute; left:-10%; right:-10%; bottom:0; height:42vh;
  background:linear-gradient(to top, rgba(139,92,246,.22), rgba(139,92,246,.05) 60%, transparent);
  opacity:.85;
  animation:fogDrift 24s ease-in-out infinite alternate;
}
@keyframes fogDrift { from { transform:translateX(-3%); } to { transform:translateX(3%); } }

/* Vinheta — escurece os cantos, mais leve que antes pra deixar o cenário aparecer */
.bg-vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 28%, transparent 46%, rgba(0,0,0,.46) 100%);
}

/* Borboletas espectrais (símbolo da Emily) flutuando bem devagar e discretas */
.bg-moth { position:absolute; opacity:.5; filter:drop-shadow(0 0 7px rgba(56,189,248,.6)); animation:mothFloat 14s ease-in-out infinite; }
.bg-moth svg { width:30px; height:30px; }
.bg-moth.m2 { opacity:.4; animation-duration:18s; animation-delay:-4s; }
.bg-moth.m2 svg { width:20px; height:20px; }
.bg-moth.m3 { opacity:.36; animation-duration:21s; animation-delay:-9s; }
.bg-moth.m3 svg { width:22px; height:22px; }
.bg-moth.m4 { opacity:.32; animation-duration:16s; animation-delay:-11s; }
.bg-moth.m4 svg { width:16px; height:16px; }

@keyframes mothFloat {
  0%   { transform:translate(0,0) rotate(0deg); }
  25%  { transform:translate(14px,-22px) rotate(8deg); }
  50%  { transform:translate(-6px,-40px) rotate(-6deg); }
  75%  { transform:translate(-18px,-14px) rotate(4deg); }
  100% { transform:translate(0,0) rotate(0deg); }
}

/* Morcegos distantes — silhuetas bem pequenas cruzando o céu devagar */
.bg-bat { position:absolute; opacity:.5; animation:batFly 26s linear infinite; }
.bg-bat svg { width:16px; height:9px; fill:#1a1430; }
.bg-bat.b2 { animation-duration:34s; animation-delay:-10s; opacity:.35; }
.bg-bat.b2 svg { width:11px; height:6px; }
@keyframes batFly {
  0%   { transform:translate(-10vw, 0) scaleX(1); }
  48%  { transform:translate(60vw, -18px) scaleX(1); }
  50%  { transform:translate(62vw, -18px) scaleX(-1); }
  100% { transform:translate(-10vw, -4px) scaleX(-1); }
}

/* Cemitério vitoriano — silhueta original em vetor, inspirada no clima do filme.
   v1.1: cena maior, com árvore seca e portão de ferro, mais nítida (menos
   transparente) pra realmente aparecer atrás do conteúdo. */
.bg-graveyard { position:absolute; left:0; right:0; bottom:0; width:100%; opacity:.85; }
.bg-graveyard svg { width:100%; height:auto; display:block; }
.bg-graveyard .gy-fill { fill:#4a3a80; }
.bg-graveyard .gy-fill-2 { fill:#2c2252; }
.bg-graveyard .gy-back { fill:#1c1638; }

/* Rosas decorativas — o símbolo da Emily, num canto discreto */
.bg-rose { position:absolute; opacity:.65; filter:drop-shadow(0 0 9px rgba(236,72,153,.55)); }
.bg-rose svg { fill:none; stroke:#ec4899; stroke-width:1.3; }

/* Teia de aranha no canto — assinatura clássica do gótico vitoriano do filme */
.bg-web { position:absolute; top:-6px; left:-6px; width:132px; height:132px; opacity:.4; }
.bg-web svg { width:100%; height:100%; }
.bg-web path { fill:none; stroke:#7dd3fc; stroke-width:.7; stroke-linecap:round; }

/* Silhueta da noiva de véu, parada entre as lápides — o sinal mais direto
   de "Noiva Cadáver": uma figura à distância, na luz azulada da lua, com
   buquê de flores murchas e leve balanço no véu, como se uma brisa do
   submundo passasse por ela de vez em quando. */
.bg-bride { position:absolute; bottom:0; right:15%; opacity:.7; z-index:1; filter:drop-shadow(0 0 14px rgba(56,189,248,.5)); transform-origin:50% 100%; animation:brideSway 9s ease-in-out infinite; }
.bg-bride svg { width:46px; height:100px; display:block; }
@keyframes brideSway { 0%,100% { transform:rotate(-1.2deg); } 50% { transform:rotate(1.2deg); } }

/* Corvo pousado no portão de ferro — clássico do gótico vitoriano do filme */
.bg-raven { position:absolute; opacity:.8; animation:ravenPeck 5s ease-in-out infinite; transform-origin:50% 100%; }
.bg-raven svg { width:24px; height:19px; display:block; }
@keyframes ravenPeck { 0%,85%,100% { transform:rotate(0deg); } 90% { transform:rotate(-6deg); } 95% { transform:rotate(3deg); } }

/* Gato preto sentado entre as lápides, olhos acesos na luz da lua */
.bg-cat { position:absolute; opacity:.85; }
.bg-cat svg { width:30px; height:26px; display:block; }
.bg-cat-eyes { animation:catBlink 6s ease-in-out infinite; }
@keyframes catBlink { 0%,92%,100% { opacity:1; } 95% { opacity:0; } }
.brand-name { font-family:'Inter',-apple-system,sans-serif; font-size:17px; font-weight:800; letter-spacing:-.2px; line-height:1; text-shadow:0 0 12px rgba(56,189,248,.35); }
.version-tag {
  display:inline-block; margin-left:7px; padding:1px 6px; border-radius:20px;
  font-family:'Inter',sans-serif; font-size:9px; font-weight:700; letter-spacing:.4px;
  color:var(--a210); border:1px solid rgba(56,189,248,.4); background:rgba(56,189,248,.1);
  vertical-align:middle; transform:translateY(-1px);
}

/* Estados vazios com um toque temático */
.empty-state { padding:40px 24px; text-align:center; }
.empty-state-icon { font-size:32px; margin-bottom:10px; opacity:.6; }
.empty-state-text { color:var(--text-sec); font-size:var(--t-md); }

/* ═══════════════════════════════════════
   RESPONSIVO — telas maiores (notebook/desktop)
   Em telas largas o app vira uma "moldura" central de largura de celular,
   com o fundo temático (lua, cemitério, borboletas) escalando junto.
   Em celular (abaixo de 640px) nada muda.
═══════════════════════════════════════ */
@media (min-width:640px) {
  body { display:flex; justify-content:center; background:#020103; }
  .bg-fx, .topbar, .tabbar { left:50%; right:auto; width:100%; max-width:480px; transform:translateX(-50%); }
  .page { max-width:480px; margin:0 auto; box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 40px 100px rgba(0,0,0,.6); }
}
@media (min-width:900px) {
  .bg-fx, .topbar, .tabbar { max-width:520px; }
  .page { max-width:520px; }
}

.topbar {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:var(--nav-h);
  padding-top:env(safe-area-inset-top, 0px);
  background:rgba(7,7,13,.9);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:flex-end; justify-content:space-between;
  padding-left:20px; padding-right:20px; padding-bottom:12px;
}
.brand { display:flex; align-items:center; gap:10px; }
.brand-icon {
  width:30px; height:30px; border-radius:9px;
  background:linear-gradient(135deg,var(--a210),var(--a240));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 14px -2px var(--a210);
}
.brand-icon svg { width:16px; height:16px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; }
.brand-city { font-size:var(--t-xs); color:var(--text-sec); margin-top:1px; }
.topbar-clock { text-align:right; }
.clock-time { font-size:var(--t-lg); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
.clock-day  { font-size:var(--t-xs); color:var(--text-sec); margin-top:1px; }

/* ═══════════════════════════════════════
   TABBAR
═══════════════════════════════════════ */
.tabbar {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  height:var(--tab-h);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background:rgba(7,7,13,.94);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  display:flex;
}
.tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; color:var(--text-ter); transition:color .15s; padding-bottom:2px;
}
.tab.active { color:var(--a210); }
.tab svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tab-lbl { font-size:var(--t-xs); font-weight:500; letter-spacing:.3px; }

/* ═══════════════════════════════════════
   PAGES
═══════════════════════════════════════ */
.page {
  display:none;
  padding-top:var(--nav-h);
  padding-bottom:var(--tab-h);
  min-height:100vh;
}
.page.active { display:block; animation:pageIn .2s ease; will-change:transform,opacity; }
@keyframes pageIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* ═══════════════════════════════════════
   HOME — SENTIDO TOGGLE
═══════════════════════════════════════ */
.sentido-wrap { padding:14px 16px 0; }
.sentido-toggle {
  display:flex; background:rgba(22,20,37,.4); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:var(--radius-sm);
  padding:3px; position:relative; border:1px solid rgba(255,255,255,.1);
}
.sentido-slider {
  position:absolute; top:3px; bottom:3px; width:calc(50% - 3px);
  background:rgba(255,255,255,.08); border-radius:8px;
  border:1px solid var(--border-hi);
  transform:translateX(0);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  will-change:transform;
  left:3px;
}
.sentido-slider.right { transform:translateX(100%); }
.sentido-btn {
  flex:1; padding:9px 10px; border-radius:8px;
  font-size:var(--t-sm); font-weight:600;
  color:var(--text-ter); display:flex; align-items:center; justify-content:center;
  gap:6px; position:relative; z-index:1; transition:color .2s;
}
.sentido-btn svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
.sentido-btn.active { color:var(--text); }

/* ═══════════════════════════════════════
   HOME — CARDS DAS LINHAS (visual simples e direto)
   Um card por linha (210 e 240), sempre os dois visíveis,
   ordenados pelo horário mais próximo primeiro.
   v1.1: fundo mais translúcido pra deixar o cenário aparecer atrás.
═══════════════════════════════════════ */
.hero-wrap { padding:14px 16px 0; }
.linecards { display:flex; flex-direction:column; gap:12px; }

.linecard {
  background:rgba(20,18,34,.46);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,.1);
  border-left:5px solid var(--a210);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:18px;
  transition:transform .12s;
}
.linecard:active { transform:scale(.99); }

.lc-top { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.lc-badge {
  width:38px; height:38px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:900; color:#fff; flex-shrink:0;
}
.lc-eyebrow { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-sec); }

.lc-time { font-size:40px; font-weight:800; letter-spacing:-1.2px; font-variant-numeric:tabular-nums; line-height:1; color:var(--text); margin-bottom:6px; }

.lc-status { font-size:15px; font-weight:700; color:var(--text-sec); margin-bottom:14px; }
.lc-status.urgente { color:var(--danger); }
.lc-status.breve   { color:var(--warning); }

.lc-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 0; border-top:1px solid var(--border);
  font-size:15px; color:var(--text-sec); font-weight:500;
}
.lc-row b { color:var(--text); font-variant-numeric:tabular-nums; font-weight:800; font-size:17px; }

.lc-walk {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 0 0; font-size:13px; color:var(--text-ter);
}
.lc-walk b { color:var(--text-sec); font-variant-numeric:tabular-nums; font-weight:700; }

/* ═══════════════════════════════════════
   HOME — TIMELINE (a viagem inteira, passo a passo = macro)
═══════════════════════════════════════ */
.timeline-wrap { padding:16px 16px 0; }
.timeline-title {
  font-size:10px; font-weight:700; color:var(--text-ter);
  text-transform:uppercase; letter-spacing:1.8px; margin-bottom:12px;
}
.timeline {
  display:flex; flex-direction:column; gap:0;
  background:rgba(15,15,26,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow);
}
.tl-item {
  display:flex; align-items:center; gap:12px;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  position:relative;
  transition:opacity .2s;
}
.tl-item:last-child { border-bottom:none; }
.tl-item.tl-future { opacity:.45; }
.tl-icon-wrap {
  width:26px; height:26px; border-radius:8px;
  background:var(--surface-el);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.tl-icon-wrap svg { width:12px; height:12px; fill:none; stroke:var(--text-ter); stroke-width:1.8; stroke-linecap:round; }
.tl-icon-wrap.active-icon { background:var(--a210); }
.tl-icon-wrap.active-icon svg { stroke:#fff; }
.tl-content { flex:1; min-width:0; }
.tl-label { font-size:10px; color:var(--text-ter); font-weight:600; text-transform:uppercase; letter-spacing:.8px; margin-bottom:2px; }
.tl-value { font-size:var(--t-sm); font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tl-value.sec { color:var(--text-sec); font-weight:500; }
.tl-time {
  font-size:var(--t-md); font-weight:700;
  font-variant-numeric:tabular-nums; letter-spacing:-.3px;
  color:var(--text-sec); flex-shrink:0;
}
.tl-item:not(.tl-future) .tl-time { color:var(--text); }

/* ═══════════════════════════════════════
   HOME — PRÓXIMOS ÔNIBUS (alternativas, só se precisar)
═══════════════════════════════════════ */
.alts-wrap { padding:16px 16px 0; }
.alts-title {
  font-size:10px; font-weight:700; color:var(--text-ter);
  text-transform:uppercase; letter-spacing:1.8px; margin-bottom:10px;
}
.alts-list { display:flex; flex-direction:column; gap:8px; }

.alt-card {
  background:rgba(15,15,26,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:12px 14px;
  display:flex; align-items:center; gap:12px;
  box-shadow:var(--shadow); cursor:pointer; transition:transform .1s;
  will-change:transform;
}
.alt-card:active { transform:scale(.98); }
.alt-badge {
  font-size:var(--t-xs); font-weight:700;
  width:38px; height:24px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid currentColor; flex-shrink:0;
}
.b210 { color:var(--a210); }
.b240 { color:var(--a240); }

.alt-info { flex:1; min-width:0; }
.alt-horario { font-size:var(--t-base); font-weight:700; font-variant-numeric:tabular-nums; }
.alt-detalhe { font-size:var(--t-xs); color:var(--text-ter); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.alt-falta { font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.falta-agora  { background:rgba(225,29,72,.15); color:var(--danger); }
.falta-breve  { background:rgba(234,179,8,.15); color:var(--warning); }
.falta-normal { background:var(--surface-el); color:var(--text-sec); }

/* ═══════════════════════════════════════
   PAGE HORÁRIOS
═══════════════════════════════════════ */
.hr-controls { padding:14px 16px 0; }
.linha-tabs  { display:flex; gap:6px; margin-bottom:10px; }
.ltab {
  flex:1; padding:9px; border-radius:var(--radius-sm);
  font-size:var(--t-base); font-weight:700;
  color:var(--text-sec); background:rgba(15,15,26,.7);
  border:1px solid var(--border);
  transition:all .15s;
}
.ltab.a210 { background:var(--a210); color:#fff; border-color:var(--a210); }
.ltab.a240 { background:var(--a240); color:#fff; border-color:var(--a240); }

.hr-controls .sentido-toggle { margin-bottom:10px; }

.turno-tabs { display:flex; gap:6px; margin-bottom:12px; }
.ttab {
  padding:6px 14px; border-radius:20px;
  font-size:var(--t-sm); font-weight:600;
  color:var(--text-ter); background:rgba(15,15,26,.7);
  border:1px solid var(--border);
  transition:all .15s;
}
.ttab.active { background:var(--surface-el); color:var(--text); border-color:var(--border-hi); }

.search-wrap { position:relative; margin-bottom:14px; }
.search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; fill:none; stroke:var(--text-ter); stroke-width:2; stroke-linecap:round; }
.search-input {
  width:100%; background:rgba(15,15,26,.7); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:10px 12px 10px 36px;
  color:var(--text); font-size:var(--t-md); font-weight:500; outline:none;
  transition:border-color .15s;
}
.search-input::placeholder { color:var(--text-ter); }
.search-input:focus { border-color:var(--a210); }

.grade { padding:0 16px 16px; }
.grade-periodo { margin-bottom:14px; }
.grade-periodo-title {
  font-size:9px; font-weight:700; color:var(--text-ter);
  text-transform:uppercase; letter-spacing:1.8px;
  padding:10px 0 8px; border-bottom:1px solid var(--border); margin-bottom:10px;
}
.grade-chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip {
  padding:7px 13px; border-radius:9px;
  font-size:var(--t-md); font-weight:600;
  color:var(--text-sec); background:rgba(15,15,26,.7);
  border:1px solid var(--border);
  font-variant-numeric:tabular-nums; transition:all .15s;
}
.chip.passado   { opacity:.22; }
.chip.proximo   { color:#fff; }
.chip.prx-210   { background:var(--a210); border-color:var(--a210); box-shadow:0 0 12px var(--a210-glow); }
.chip.prx-240   { background:var(--a240); border-color:var(--a240); box-shadow:0 0 12px var(--a240-glow); }
.chip.highlight { background:var(--surface-el); color:var(--text); border-color:var(--border-hi); }
.no-results { font-size:var(--t-md); color:var(--text-ter); padding:20px 0; text-align:center; }

/* Casa → Estação: lista com par de horários (saída de casa + passagem no ponto) */
.casa-list {
  background:rgba(15,15,26,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
}
.casa-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; border-bottom:1px solid var(--border);
  border-left:3px solid transparent;
  transition:opacity .2s, background .2s;
}
.casa-row:last-child { border-bottom:none; }
.casa-row.passado { opacity:.28; }
.casa-row.highlight { background:var(--surface-el); }
.casa-left, .casa-right { min-width:0; }
.casa-right { text-align:right; }
.casa-lbl {
  font-size:9px; font-weight:700; color:var(--text-ter);
  text-transform:uppercase; letter-spacing:.6px; margin-bottom:2px;
}
.casa-sair { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text); }
.casa-ponto { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--text-sec); }
.casa-mid { flex-shrink:0; opacity:.5; }
.casa-mid svg { width:13px; height:13px; fill:none; stroke:var(--text-ter); stroke-width:2; stroke-linecap:round; }

/* ═══════════════════════════════════════
   PAGE LINHAS
═══════════════════════════════════════ */
.linhas-wrap { padding:16px; }

/* ═══════════════════════════════════════
   SIMULADOR DE HORÁRIO (página Linhas)
   Simula "e se fosse tal dia, tal hora" — tipo o seletor de horário do Google
   Maps. Mostra, pros dois sentidos, o horário de embarque/chegada calculado
   pra qualquer dia e hora escolhidos, sem depender do horário real do celular.
═══════════════════════════════════════ */
.sim-card {
  background:rgba(20,18,34,.5); backdrop-filter:blur(20px) saturate(170%); -webkit-backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,.1); border-radius:var(--radius);
  box-shadow:var(--shadow-lg); padding:16px; margin-bottom:16px;
}
.sim-title { font-size:11px; font-weight:700; color:var(--text-ter); text-transform:uppercase; letter-spacing:1.4px; margin-bottom:12px; display:flex; align-items:center; gap:6px; }

.sim-toggle { display:flex; background:rgba(255,255,255,.05); border-radius:var(--radius-sm); padding:3px; position:relative; border:1px solid var(--border); margin-bottom:10px; }
.sim-toggle-slider { position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); background:rgba(255,255,255,.1); border-radius:8px; border:1px solid var(--border-hi); transition:transform .25s cubic-bezier(.4,0,.2,1); }
.sim-toggle-slider.right { transform:translateX(100%); }
.sim-toggle-btn { flex:1; padding:8px 8px; border-radius:8px; font-size:12px; font-weight:600; color:var(--text-ter); display:flex; align-items:center; justify-content:center; gap:5px; position:relative; z-index:1; transition:color .2s; }
.sim-toggle-btn.active { color:var(--text); }

.sim-day-tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.sim-day-tab { padding:7px 12px; border-radius:20px; font-size:12px; font-weight:600; color:var(--text-ter); background:rgba(255,255,255,.05); border:1px solid var(--border); }
.sim-day-tab.active { background:rgba(255,255,255,.12); color:var(--text); border-color:var(--border-hi); }

.sim-time-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.sim-time-input {
  flex:1; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:9px 12px; color:var(--text); font-size:var(--t-md); font-weight:600; outline:none; font-variant-numeric:tabular-nums;
  color-scheme:dark;
}
.sim-time-input:focus { border-color:var(--a210); }
.sim-now-btn { padding:9px 12px; border-radius:var(--radius-sm); background:rgba(255,255,255,.05); border:1px solid var(--border); font-size:12px; font-weight:600; color:var(--text-sec); white-space:nowrap; }

.sim-results { margin-top:14px; display:flex; flex-direction:column; gap:12px; }
.sim-line-block { border-top:1px solid var(--border); padding-top:12px; }
.sim-line-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.sim-line-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.sim-line-name { font-size:13px; font-weight:700; color:var(--text-sec); }
.sim-empty-line { font-size:12px; color:var(--text-ter); padding:2px 0 4px; }
.lcard {
  background:rgba(15,15,26,.72); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow); margin-bottom:12px;
}
.lcard-head { padding:18px; background:rgba(22,20,37,.55); border-bottom:1px solid var(--border); }
.lcard-top { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.lcard-num {
  width:52px; height:52px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:900; color:#fff; flex-shrink:0;
}
.n210 { background:linear-gradient(135deg,var(--a210),#0369a1); }
.n240 { background:linear-gradient(135deg,var(--a240),#4c1d95); }
.lcard-title { font-size:var(--t-lg); font-weight:700; letter-spacing:-.3px; }
.lcard-sub   { font-size:var(--t-xs); color:var(--text-sec); margin-top:2px; }
.lcard-rota  { background:var(--surface-hi); border-radius:var(--radius-sm); padding:10px 14px; display:flex; align-items:center; gap:8px; }
.rp          { flex:1; }
.rp-lbl      { font-size:9px; color:var(--text-ter); text-transform:uppercase; letter-spacing:.8px; font-weight:700; margin-bottom:2px; }
.rp-val      { font-size:var(--t-xs); color:var(--text-sec); line-height:1.3; }
.rp-arrow svg{ width:14px; height:14px; fill:none; stroke:var(--text-ter); stroke-width:2; stroke-linecap:round; }

.lcard-stats { display:grid; grid-template-columns:1fr 1fr 1fr; border-bottom:1px solid var(--border); }
.stat        { padding:14px 16px; border-right:1px solid var(--border); }
.stat:last-child { border-right:none; }
.stat-lbl    { font-size:9px; color:var(--text-ter); text-transform:uppercase; letter-spacing:.8px; font-weight:700; margin-bottom:4px; }
.stat-val    { font-size:var(--t-xl); font-weight:800; }
.stat-sub    { font-size:9px; color:var(--text-ter); margin-top:2px; }

.lcard-directions { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
.ldir-card { background:var(--surface-hi); border-radius:var(--radius-sm); padding:12px 13px; }
.ldir-label { display:flex; align-items:center; gap:5px; font-size:9px; font-weight:700; color:var(--text-ter); text-transform:uppercase; letter-spacing:.7px; margin-bottom:8px; }
.ldir-label svg { width:11px; height:11px; fill:none; stroke:var(--text-ter); stroke-width:2; stroke-linecap:round; }
.ldir-time { font-size:var(--t-lg); font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; margin-bottom:5px; }
.ldir-sub { font-size:10px; color:var(--text-sec); margin-bottom:8px; line-height:1.4; }
.ldir-pill { display:inline-block; font-size:10px; font-weight:700; padding:4px 9px; border-radius:20px; }
.ldir-empty { font-size:var(--t-xs); color:var(--text-ter); padding:2px 0 6px; }

.lcard-infos { }
.info-row    { display:flex; align-items:flex-start; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); }
.info-row:last-child { border-bottom:none; }
.info-icon   { width:28px; height:28px; border-radius:8px; background:var(--surface-el); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
.info-icon svg { width:14px; height:14px; fill:none; stroke:var(--text-sec); stroke-width:1.8; stroke-linecap:round; }
.info-text   { font-size:var(--t-sm); color:var(--text-sec); line-height:1.55; }
.info-text b { color:var(--text); font-weight:600; }
</style>
</head>

<!-- TOPBAR -->
<header class="topbar">

const APP_VERSION = '1.1.0';

═══════════════════════════════════════ */
const $ = id => document.getElementById(id);
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minToH = n => { n=((n%1440)+1440)%1440; const h=Math.floor(n/60),m=n%60; return `${h<10?'0':''}${h}:${m<10?'0':''}${m}`; };
const pad2   = n => String(n).padStart(2,'0');

// Caminhada total de casa até o ponto de ônibus (apto→rua + rua→ponto)
const casaTotal = L => L.aptoRua + L.ruaPonto;

function faltaStr(d, modo='onibus') {
  if (d <= 0)  return modo==='casa' ? 'Saia agora' : 'Embarque agora';
  if (d <= 1)  return modo==='casa' ? 'Saia em 1 min' : 'Ônibus chegando';

  const h=Math.floor(d/60), m=d%60;

}

function faltaCls(d) {
  return d <= 0 ? 'falta-agora' : d <= 8 ? 'falta-breve' : 'falta-normal';
}

function getTransito(h, day) {
  const sex=day===5, ma=h>=6&&h<10, ta=h>=17&&h<20;
  // e210/e240 = minutos extras somados ao tempoBase em cada condição de trânsito.
  // ATENÇÃO Linha 210 - pico manhã: zerado em 22/08/2026. A única observação real
  // que temos (07:12 saída → 07:25 no ponto = 13 min) aconteceu justamente dentro
  // da janela de pico manhã (06h-10h) e já bateu exatamente com o novo tempoBase
  // de 13 min, sem precisar de nenhum adicional. Ou seja, com um único dado, não dá
  // pra saber se o pico realmente atrasa essa linha — então, pra não contar o
  // atraso duas vezes, deixamos em 0 até surgir outro registro que prove o contrário.
  // Os demais valores (tarde, sexta, linha 240) continuam sendo estimativas antigas,
  // ainda não validadas com dado real — mexer neles só quando houver observação.
  if (sex&&(ma||ta)) return { e210:15, e240:7,  label:'Sexta + Pico',          tipo:'sexta'  };
  if (sex)           return { e210:5,  e240:3,  label:'Sexta — lentidão',      tipo:'sexta'  };
  if (ma)            return { e210:0,  e240:5,  label:'Pico manhã',            tipo:'pico'   };
  if (ta)            return { e210:8,  e240:4,  label:'Pico tarde',            tipo:'pico'   };
  return               { e210:0,  e240:0,  label:'',                      tipo:'normal' };
}

function getLista(id, day) {
  const k = day===0?'dom':day===6?'sab':'util';
  return LINHAS[id].horarios[k];
}

const svgArrow = `<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

/* ═══════════════════════════════════════

   aptoRua  → min a pé do apartamento até a rua
   ruaPonto → min a pé da rua até o ponto do ônibus

═══════════════════════════════════════ */

    tempoBase:13, caminhada:0, aptoRua:3, ruaPonto:1,
    horarios:{
      util:['04:05','04:25','04:45','05:05','05:25','05:47','06:10','06:35','07:01','07:27','07:53','08:21','09:10','10:02','10:50','11:15','11:40','12:05','12:30','12:55','13:20','13:45','14:10','14:35','15:00','15:25','15:50','16:15','16:33','16:51','17:10','17:28','17:46','18:05','18:23','18:41','19:00','19:18','19:36','19:55','20:15','20:45','21:20','21:55','22:10','22:25','22:40','23:00','23:10','23:35','00:05','00:35','01:10'],
      sab: ['04:05','04:25','04:45','05:05','05:25','05:45','06:05','06:27','06:50','07:12','07:35','07:57','08:20','08:45','09:22','10:00','10:42','11:10','11:35','12:00','12:25','12:50','13:15','13:40','14:05','14:30','14:55','15:20','15:45','16:10','16:35','17:00','17:25','17:50','18:15','18:40','19:05','19:30','19:55','20:30','21:10','21:50','22:15','22:35','22:55','23:15','23:35','00:00','00:30','01:00'],
      dom: ['04:10','04:50','05:30','06:10','06:55','07:42','08:30','09:18','10:00','10:25','10:48','11:10','11:33','11:55','12:18','12:40','13:03','13:25','13:48','14:10','14:33','14:55','15:18','15:40','16:03','16:25','16:48','17:10','17:33','17:55','18:18','18:43','19:20','20:00','20:40','21:03','21:25','21:48','22:33','23:18','00:05','00:55']

  },

    horarios:{
      util:['04:00','04:25','04:45','04:56','05:07','05:17','05:27','05:38','05:46','05:54','06:02','06:10','06:18','06:26','06:35','06:44','06:53','07:02','07:11','07:20','07:29','07:38','07:47','07:56','08:05','08:15','08:25','08:37','08:50','09:05','09:21','09:37','09:53','10:10','10:27','10:44','10:57','11:09','11:20','11:31','11:42','11:53','12:04','12:16','12:27','12:39','12:50','13:02','13:15','13:30','13:45','13:57','14:09','14:20','14:30','14:40','14:50','15:00','15:10','15:20','15:30','15:40','15:50','16:00','16:10','16:20','16:30','16:41','16:51','17:02','17:12','17:23','17:33','17:44','17:54','18:05','18:15','18:25','18:35','18:45','18:55','19:05','19:15','19:25','19:35','19:45','19:57','20:10','20:25','20:40','20:56','21:13','21:30','21:47','22:02','22:15','22:28','22:41','22:53','23:05','23:17','23:30','23:43','23:55','00:10','00:25','00:40','01:00'],
      sab: ['04:00','04:25','04:41','04:55','05:08','05:22','05:36','05:51','06:05','06:19','06:34','06:49','07:03','07:18','07:33','07:47','08:02','08:18','08:40','09:05','09:32','09:59','10:26','10:54','11:22','11:51','12:15','12:35','12:55','13:11','13:27','13:43','13:59','14:15','14:31','14:47','15:04','15:20','15:36','15:53','16:09','16:25','16:42','17:00','17:18','17:36','17:54','18:12','18:28','18:45','19:02','19:20','19:42','20:10','20:46','21:22','21:55','22:20','22:45','23:10','23:35','00:00','00:25','01:00'],
      dom: ['04:25','04:46','05:07','05:28','05:49','06:10','06:32','06:54','07:16','07:38','08:00','08:25','09:00','09:38','10:16','10:54','11:18','11:41','11:57','12:12','12:28','12:44','12:59','13:14','13:30','13:45','14:00','14:16','14:31','14:46','15:02','15:17','15:32','15:48','16:03','16:18','16:34','16:49','17:05','17:21','17:36','17:52','18:10','18:35','19:12','19:50','20:20','20:50','21:20','21:50','22:20','22:50','23:20','00:00','00:50']
    }
  }
};

/* ═══════════════════════════════════════
   ESTADO
═══════════════════════════════════════ */
let sentido = 'estacao';

/* ═══════════════════════════════════════
   FONTE DA VERDADE: qual ônibus é relevante AGORA
   Baseado só na saída da estação. Considera dois casos:
   - o ônibus já saiu e ainda está a caminho do ponto (em trânsito)
   - o ônibus ainda não saiu (aguardando partida)
   Nunca mistura isso com a caminhada até em casa.
   Recebe `nowMin` como referência de tempo — pode ser o agora real ou um
   horário simulado, a função não sabe (nem precisa saber) a diferença.
═══════════════════════════════════════ */
function getRelevantBus(id, day, nowMin, tr) {
  const L = LINHAS[id];
  const lista = getLista(id, day);
  const extra = id===210 ? tr.e210 : tr.e240;

  const idxNext = lista.findIndex(t => toMin(t) > nowMin);
  const lastIdx = idxNext === -1 ? lista.length - 1 : idxNext - 1;

  const build = (t, emTransito) => {
    const partidaMin    = toMin(t);
    const chegaPontoMin = partidaMin + L.tempoBase + extra;
    const chegaCasaMin  = chegaPontoMin + L.caminhada;
    return { id, L, partida:t, partidaMin, chegaPontoMin, chegaCasaMin, emTransito, extra };
  };

  // Se o último ônibus que saiu ainda não chegou no ponto, ele é o relevante
  if (lastIdx >= 0) {
    const t = lista[lastIdx];
    const chegaPontoMin = toMin(t) + L.tempoBase + extra;
    if (chegaPontoMin > nowMin) return build(t, true);
  }
  // Senão, o próximo a sair
  if (idxNext === -1) return null;
  return build(lista[idxNext], false);
}

/* ═══════════════════════════════════════
   CASA → ESTAÇÃO: qual ônibus pegar no ponto perto de casa
   Fluxo real da linha: sai da estação → passa no ponto perto de casa → volta pra
   estação. Pra ir de casa pra estação, você embarca nesse MESMO ônibus quando ele
   passa no ponto — não importa a que horas ele tinha saído da estação.
   Por isso o cálculo é: pra cada partida (já em trânsito ou futura), acha o
   horário que ela passa no ponto (igual ao getRelevantBus) e verifica se dá
   tempo de chegar andando até lá partindo de `nowMin` (real ou simulado).
   O primeiro que for alcançável é o ônibus certo.
═══════════════════════════════════════ */
function getRelevantPickup(id, day, nowMin, tr) {
  const L = LINHAS[id];
  const lista = getLista(id, day);
  const extra = id===210 ? tr.e210 : tr.e240;
  const walk = casaTotal(L);

  const idxNext = lista.findIndex(t => toMin(t) > nowMin);
  // Começa a busca no último ônibus que já saiu (pode estar em trânsito e ainda
  // ser alcançável) e segue pelas próximas partidas futuras.
  const startIdx = Math.max(0, idxNext === -1 ? lista.length - 1 : idxNext - 1);

  for (let i = startIdx; i < lista.length; i++) {
    const t = lista[i];
    const partidaMin    = toMin(t);
    const chegaPontoMin = partidaMin + L.tempoBase + extra;
    if (chegaPontoMin <= nowMin) continue;               // já passou no ponto, não serve mais
    if (nowMin + walk <= chegaPontoMin) {                 // dá tempo de chegar andando até o ponto
      return { id, L, partida:t, partidaMin, chegaPontoMin, emTransito: partidaMin <= nowMin };
    }
  }
  return null; // nenhum ônibus alcançável nesse dia/horário
}

const ICO_AGORA  = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>`;

function tickClock() {

═══════════════════════════════════════ */
function renderHome() {
  const now = new Date();
  const day = now.getDay(), h = now.getHours(), m = now.getMinutes();
  const nowMin = h*60+m;
  const tr = getTransito(h, day);

  sentido==='estacao' ? renderModoEstacao(day, h, nowMin, tr) : renderModoCasa(day, h, nowMin, tr);
}

/* ---- Sentido: Estação → Casa ----
   Regra: a saída da estação é o dado confiável.
   1) "Chega no ponto perto de casa"  → partida + tempoBase + trânsito  (SEMPRE em destaque)
   2) "Chega em casa"                 → o acima + caminhada             (separado, menor)
   Se um ônibus já saiu e ainda não chegou no ponto, ele aparece como "a caminho".
*/
function renderModoEstacao(day, h, nowMin, tr) {
  const opts = [210, 240].map(id => getRelevantBus(id, day, nowMin, tr)).filter(Boolean);

  if (!opts.length) {
    $('heroWrap').innerHTML = `<div class="empty-state"><div class="empty-state-icon">🌙</div><div class="empty-state-text">Nenhum horário disponível hoje.<br>Até os fantasmas descansam.</div></div>`;
    $('timelineWrap').innerHTML = ''; $('altsWrap').innerHTML = '';
    return;
  }

  // Ordena pelo horário de saída da estação: quem sai primeiro aparece primeiro
  opts.sort((a, b) => a.partidaMin - b.partidaMin);

  const cardsHtml = opts.map(o => {
    const { id, L, partida, partidaMin, chegaPontoMin, chegaCasaMin, emTransito, extra } = o;
    const chegaPonto = minToH(chegaPontoMin);
    const chegaCasa  = minToH(chegaCasaMin);

    let statusLine, urgLevel;
    if (emTransito) {
      const haMin = nowMin - partidaMin;
      statusLine = `há ${haMin} min · a caminho do ponto`;
      urgLevel = (chegaPontoMin - nowMin) <= 3 ? 'urgente' : 'breve';
    } else {
      const diff = partidaMin - nowMin;
      statusLine = faltaStr(diff, 'onibus');
      urgLevel = diff <= 3 ? 'urgente' : diff <= 8 ? 'breve' : null;
    }

    return renderLineCard({
      id, cor:L.cor,
      eyebrow: emTransito ? 'saiu da estação' : 'sai da estação',
      bigTime: partida, statusLine, urgLevel,
      rows: [{ label:'Chega no ponto perto de casa', time:chegaPonto }],
      walkLabel: L.caminhada>0 ? `Chega em casa (${L.caminhada} min a pé)` : null,
      walkTime:  L.caminhada>0 ? chegaCasa : null
    });
  });

  $('heroWrap').innerHTML = `<div class="linecards">${cardsHtml.join('')}</div>`;
  $('timelineWrap').innerHTML = '';
  $('altsWrap').innerHTML = '';
}

/* ---- Sentido: Casa → Estação ----
   Mesmo racional: o horário de saída da estação é o dado confiável.
   Aqui calculamos quando sair de casa pra alcançar aquele ônibus,
   e mostramos a chegada no ponto separada da chegada em casa.
*/
function renderModoCasa(day, h, nowMin, tr) {
  const candidatos = [210, 240].map(id => getRelevantPickup(id, day, nowMin, tr)).filter(Boolean);

  if (!candidatos.length) {
    $('heroWrap').innerHTML = `<div class="empty-state"><div class="empty-state-icon">🦇</div><div class="empty-state-text">Nenhum ônibus alcançável hoje.</div></div>`;
    $('timelineWrap').innerHTML = ''; $('altsWrap').innerHTML = '';
    return;
  }

  // Ordena por quem passa primeiro no ponto perto de casa
  candidatos.sort((a, b) => a.chegaPontoMin - b.chegaPontoMin);

  const cardsHtml = candidatos.map(c => {
    const { id, L, partida, partidaMin, chegaPontoMin, emTransito } = c;
    const walk = casaTotal(L);
    const sairAptoMin = chegaPontoMin - walk;
    const chegaPonto = minToH(chegaPontoMin);
    const sairApto = minToH(sairAptoMin);

    let statusLine, urgLevel;
    if (emTransito) {
      const haMin = nowMin - partidaMin;
      statusLine = `há ${haMin} min a caminho · ainda dá tempo`;
      urgLevel = (chegaPontoMin - nowMin) <= 3 ? 'urgente' : 'breve';
    } else {
      const diff = chegaPontoMin - nowMin;
      statusLine = faltaStr(diff, 'onibus');
      urgLevel = diff <= 3 ? 'urgente' : diff <= 8 ? 'breve' : null;
    }

    return renderLineCard({
      id, cor:L.cor,
      eyebrow: emTransito ? 'a caminho do ponto' : 'ônibus chega no ponto',
      bigTime: chegaPonto, statusLine, urgLevel,
      rows: [
        { label:'Saia de casa até', time:sairApto },
        { label: emTransito ? 'Saiu da estação' : 'Sai da estação', time:partida }
      ]
    });
  });

  $('heroWrap').innerHTML = `<div class="linecards">${cardsHtml.join('')}</div>`;
  $('timelineWrap').innerHTML = '';
  $('altsWrap').innerHTML = '';
}

function goPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el  => el.classList.remove('active'));
  $(`page-${p}`).classList.add('active');

/* ═══════════════════════════════════════
   PAGE: HORÁRIOS
═══════════════════════════════════════ */
let gradeLinha=210, gradeTurno='util', gradeSentido='estacao';

function setGradeSentido(s) {
  gradeSentido = s;
  $('hrBtnEst').classList.toggle('active',  s==='estacao');
  $('hrBtnCasa').classList.toggle('active', s==='casa');
  $('hrSentidoSlider').classList.toggle('right', s==='casa');
  renderGrade();
}

function selecionarLinha(id) {
  gradeLinha = id;
  $('ltab210').className = `ltab${id===210?' a210':''}`;
  $('ltab240').className = `ltab${id===240?' a240':''}`;
  renderGrade();
}

function selecionarTurno(t) {
  gradeTurno = t;
  ['util','sab','dom'].forEach(x => $(`t${x}`).classList.toggle('active', x===t));
  renderGrade();
}

function renderGrade() {
  gradeSentido === 'casa' ? renderGradeCasa() : renderGradeEstacao();
}

/* Estação → Casa: grade original — chips só com a saída da estação
   (o dado confiável único), sem nenhum cálculo extra em cima. */
function renderGradeEstacao() {
  const now=new Date(), day=now.getDay(), nowMin=now.getHours()*60+now.getMinutes();
  const lista = LINHAS[gradeLinha].horarios[gradeTurno];
  const query = ($('searchInput').value||'').trim();
  const isHoje = (gradeTurno==='util'&&day>=1&&day<=5)||(gradeTurno==='sab'&&day===6)||(gradeTurno==='dom'&&day===0);
  const proxIdx = isHoje ? lista.findIndex(t=>toMin(t)>nowMin) : -1;
  const filtered = query ? lista.filter(t=>t.startsWith(query)||t.replace(':','').startsWith(query)) : lista;

  if (query && !filtered.length) { $('grade').innerHTML=`<div class="no-results">Nenhum horário para "${query}".</div>`; return; }

  const grupos = { manha:[], tarde:[], noite:[] };
  const nomes  = { manha:'Manhã · 04h–11h59', tarde:'Tarde · 12h–17h59', noite:'Noite · 18h–01h' };
  filtered.forEach(t => { const hh=parseInt(t); grupos[hh<12?'manha':hh<18?'tarde':'noite'].push(t); });

  const pCls = gradeLinha===210 ? 'prx-210' : 'prx-240';

  $('grade').innerHTML = ['manha','tarde','noite'].filter(g=>grupos[g].length).map(g => `
    <div class="grade-periodo">
      <div class="grade-periodo-title">${nomes[g]}</div>
      <div class="grade-chips">
        ${grupos[g].map(t => {
          const idx = lista.indexOf(t);
          let cls = 'chip';
          if (isHoje && !query) { if (idx===proxIdx) cls+=` proximo ${pCls}`; else if (toMin(t)<=nowMin) cls+=' passado'; }
          if (query) cls+=' highlight';
          return `<div class="${cls}">${t}</div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

/* Casa → Estação: reaproveita a MESMA lista de saídas da estação (fonte da
   verdade única), mas deriva pra cada partida o par "hora de sair de casa" +
   "hora que o ônibus passa no ponto" — as duas juntas, lado a lado, como
   pedido. O trânsito usado é o do horário de cada ônibus específico (não o
   trânsito do momento atual), igual a lógica do simulador. Como as abas de
   dia aqui são por turno (não por dia da semana exato), 'Dias úteis' assume
   Seg–Qui como referência — pra conferir sexta-feira especificamente, use o
   simulador na aba Linhas. */
function renderGradeCasa() {
  const now=new Date(), day=now.getDay(), nowMin=now.getHours()*60+now.getMinutes();
  const L = LINHAS[gradeLinha];
  const lista = L.horarios[gradeTurno];
  const query = ($('searchInput').value||'').trim();
  const isHoje = (gradeTurno==='util'&&day>=1&&day<=5)||(gradeTurno==='sab'&&day===6)||(gradeTurno==='dom'&&day===0);
  const dayForCalc = gradeTurno==='util' ? 2 : gradeTurno==='sab' ? 6 : 0;
  const walk = casaTotal(L);

  const items = lista.map(t => {
    const hh = parseInt(t);
    const tr = getTransito(hh, dayForCalc);
    const extra = gradeLinha===210 ? tr.e210 : tr.e240;
    const chegaPontoMin = toMin(t) + L.tempoBase + extra;
    const sairAptoMin = chegaPontoMin - walk;
    return { t, chegaPontoMin, sairAptoMin, chegaPonto: minToH(chegaPontoMin), sairApto: minToH(sairAptoMin) };
  });

  const qNorm = query.replace(':','');
  const filtered = query ? items.filter(it =>
    it.sairApto.startsWith(query) || it.sairApto.replace(':','').startsWith(qNorm) ||
    it.chegaPonto.startsWith(query) || it.chegaPonto.replace(':','').startsWith(qNorm) ||
    it.t.startsWith(query)
  ) : items;

  if (query && !filtered.length) { $('grade').innerHTML=`<div class="no-results">Nenhum horário para "${query}".</div>`; return; }

  const proxIdx = isHoje ? items.findIndex(it=>it.sairAptoMin>nowMin) : -1;

  const grupos = { manha:[], tarde:[], noite:[] };
  const nomes  = { manha:'Manhã · 04h–11h59', tarde:'Tarde · 12h–17h59', noite:'Noite · 18h–01h' };
  filtered.forEach(it => {
    const hhSair = Math.floor((((it.sairAptoMin%1440)+1440)%1440)/60);
    grupos[hhSair<12?'manha':hhSair<18?'tarde':'noite'].push(it);
  });

  $('grade').innerHTML = ['manha','tarde','noite'].filter(g=>grupos[g].length).map(g => `
    <div class="grade-periodo">
      <div class="grade-periodo-title">${nomes[g]}</div>
      <div class="casa-list">
        ${grupos[g].map(it => {
          const idxReal = items.indexOf(it);
          let cls = '', style = '';
          if (isHoje && !query) {
            if (idxReal===proxIdx) style = `border-left-color:${L.cor}; background:${L.dim};`;
            else if (it.sairAptoMin<=nowMin) cls='passado';
          }
          if (query) cls='highlight';
          return `
            <div class="casa-row ${cls}" style="${style}">
              <div class="casa-left">
                <div class="casa-lbl">Saia de casa</div>
                <div class="casa-sair">${it.sairApto}</div>
              </div>
              <div class="casa-mid">${svgArrow}</div>
              <div class="casa-right">
                <div class="casa-lbl">Ônibus no ponto</div>
                <div class="casa-ponto">${it.chegaPonto}</div>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

/* ═══════════════════════════════════════
   PAGE: LINHAS — dados ao vivo por sentido
═══════════════════════════════════════ */
function proximoInfoLinha(id, day, nowMin, tr, direcao) {
  const L = LINHAS[id];
  if (direcao === 'estacao') {
    const o = getRelevantBus(id, day, nowMin, tr);
    if (!o) return null;
    const diff = o.emTransito ? 0 : (o.partidaMin - nowMin);
    return { horario:o.partida, diff, sub:`Chega no ponto ≈${minToH(o.chegaPontoMin)}`, emTransito:o.emTransito };
  } else {
    const c = getRelevantPickup(id, day, nowMin, tr);
    if (!c) return null;
    const walk = casaTotal(L);
    const sairAptoMin = c.chegaPontoMin - walk;
    const diff = sairAptoMin - nowMin;
    return { horario:minToH(c.chegaPontoMin), diff, sub:`Saia de casa até ${minToH(sairAptoMin)}`, emTransito:c.emTransito };
  }
}

function renderDirCard(id, day, nowMin, tr, direcao) {
  const info = proximoInfoLinha(id, day, nowMin, tr, direcao);
  const isEst = direcao==='estacao';
  const label = isEst ? 'Estação → Casa' : 'Casa → Estação';
  const icon  = isEst ? ICO_ONIBUS : ICO_CASA;
  if (!info) {
    return `<div class="ldir-card"><div class="ldir-label">${icon}${label}</div><div class="ldir-empty">Sem horários hoje</div></div>`;
  }
  const modo = isEst ? 'onibus' : 'casa';
  const pillTxt = info.emTransito ? 'A caminho' : faltaStr(info.diff, modo);
  const pillCls = info.emTransito ? 'falta-breve' : faltaCls(info.diff);
  return `
    <div class="ldir-card">
      <div class="ldir-label">${icon}${label}</div>
      <div class="ldir-time">${info.horario}</div>
      <div class="ldir-sub">${info.sub}</div>
      <div class="ldir-pill ${pillCls}">${pillTxt}</div>
    </div>`;
}

   PAGE: LINHAS

          <div class="stat"><div class="stat-lbl">Casa→Ponto</div><div class="stat-val">${totalCasa}min</div><div class="stat-sub">${L.aptoRua}+${L.ruaPonto} a pé</div></div>

        </div>

          <div class="info-row"><div class="info-icon"><svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg></div><div class="info-text"><b>Apto → rua:</b> ${L.aptoRua} min · <b>Rua → ponto:</b> ${L.ruaPonto} min</div></div>
          ${L.caminhada>0?`<div class="info-row"><div class="info-icon"><svg viewBox="0 0 24 24"><path d="M13 4a1 1 0 1 0 2 0M6 20l4-8 4 3 3-5"/></svg></div><div class="info-text"><b>${L.caminhada} min a pé</b> do ponto de desembarque até em casa</div></div>`:''}
          <div class="info-row"><div class="info-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div class="info-text"><b>Pico manhã:</b> +${id===210?0:5} min · <b>Pico tarde:</b> +${id===210?8:4} min</div></div>
          <div class="info-row"><div class="info-icon"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="info-text"><b>Sextas:</b> +${id===210?5:3} a +${id===210?15:7} min estimado</div></div>
          <div class="info-row"><div class="info-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 18v2M17 18v2M3 11h18"/></svg></div><div class="info-text">Primeira: <b>${util[0]}</b> · Última: <b>${util[util.length-1]}</b> · Carros adaptados</div></div>

/* ═══════════════════════════════════════
   SIMULADOR DE HORÁRIO (página Linhas)
   Pega um dia/hora escolhidos pelo usuário (não precisa ser "agora") e reusa
   exatamente as mesmas fontes da verdade (getRelevantBus / getRelevantPickup)
   que a Home usa — só que com `nowMin`/`day` vindos dos controles, não do
   relógio real. Assim o resultado da simulação nunca diverge da lógica ao vivo.
═══════════════════════════════════════ */
let simSentido = 'estacao';
let simDay = 2; // 2=Seg–Qui · 5=Sexta · 6=Sábado · 0=Dom/Feriado

function setSimSentido(s) {
  simSentido = s;
  $('simBtnEst').classList.toggle('active',  s==='estacao');
  $('simBtnCasa').classList.toggle('active', s==='casa');
  $('simToggleSlider').classList.toggle('right', s==='casa');
  renderSimulador();
}

function setSimDay(d) {
  simDay = d;
  document.querySelectorAll('#simDayTabs .sim-day-tab').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.day) === d);
  });
  renderSimulador();
}

function simUsarAgora() {
  const now = new Date();
  $('simTimeInput').value = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const realDay = now.getDay();
  const mapped = realDay===0 ? 0 : realDay===6 ? 6 : realDay===5 ? 5 : 2;
  setSimDay(mapped); // já chama renderSimulador()
}

function initSimulador() {
  if (!$('simTimeInput').value) simUsarAgora();
  else renderSimulador();
}

function renderSimulador() {
  const timeVal = $('simTimeInput').value;
  if (!timeVal) { $('simResults').innerHTML = `<div class="sim-empty-line">Escolha um horário pra simular.</div>`; return; }

  const [hh, mm] = timeVal.split(':').map(Number);
  const nowMin = hh*60 + mm;
  const day = simDay;
  const tr = getTransito(hh, day);

  $('simResults').innerHTML = [210, 240].map(id => {
    const L = LINHAS[id];
    let inner;

    if (simSentido === 'estacao') {
      const o = getRelevantBus(id, day, nowMin, tr);
      if (!o) {
        inner = `<div class="sim-empty-line">Nenhum ônibus depois desse horário nesse dia.</div>`;
      } else {
        inner = `
          <div class="lc-row"><span>Sai da estação</span><b>${o.partida}</b></div>
          <div class="lc-row"><span>Chega no ponto perto de casa</span><b>${minToH(o.chegaPontoMin)}</b></div>
          ${L.caminhada>0 ? `<div class="lc-walk"><span>🚶 Chega em casa (${L.caminhada} min a pé)</span><b>${minToH(o.chegaCasaMin)}</b></div>` : ''}
        `;
      }
    } else {
      const c = getRelevantPickup(id, day, nowMin, tr);
      if (!c) {
        inner = `<div class="sim-empty-line">Nenhum ônibus alcançável nesse dia/horário.</div>`;
      } else {
        const walk = casaTotal(L);
        const sairAptoMin = c.chegaPontoMin - walk;
        inner = `
          <div class="lc-row"><span>Saia de casa até</span><b>${minToH(sairAptoMin)}</b></div>
          <div class="lc-row"><span>Ônibus passa no ponto</span><b>${minToH(c.chegaPontoMin)}</b></div>
          <div class="lc-row"><span>Saiu/sai da estação</span><b>${c.partida}</b></div>
        `;
      }
    }

    return `
      <div class="sim-line-block">
        <div class="sim-line-head">
          <div class="sim-line-dot" style="background:${L.cor}"></div>
          <div class="sim-line-name">Linha ${id} · ${L.nome}</div>
        </div>
        ${inner}
      </div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function refreshDynamic() {
  renderHome();
  if ($('page-linhas').classList.contains('active')) renderLinhas();
}

tickClock();
renderHome();
setInterval(tickClock, 1000);
setInterval(refreshDynamic, 30000);
